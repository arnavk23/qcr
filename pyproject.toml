[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qcr"
dynamic = ["version"]
description = "Exact, hardware-aware local rewriting of quantum circuits, with certified Clifford ground truth."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Arnav Kapoor" }]
requires-python = ">=3.10"
keywords = ["quantum computing", "circuit optimization", "qiskit", "clifford", "compiler"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "qiskit>=1.2",
    "networkx>=3.0",
]

[project.optional-dependencies]
hardware = ["qiskit-ibm-runtime>=0.30", "qiskit-aer>=0.15"]
tket = ["pytket>=1.30"]
bqskit = ["bqskit>=1.2"]
experiments = ["qcr[hardware,tket,bqskit]", "matplotlib>=3.7", "pylatexenc>=2.10", "mqt.qcec>=3.0"]
test = ["pytest>=8", "pytest-cov>=5"]
lint = ["ruff>=0.16"]
docs = ["sphinx>=7", "furo", "reno>=4"]
dev = ["qcr[test,lint,docs]", "pre-commit>=3", "tox>=4"]

[project.urls]
Homepage = "https://github.com/arnavk23/qcr"
Documentation = "https://github.com/arnavk23/qcr/tree/main/docs"
Issues = "https://github.com/arnavk23/qcr/issues"
"Release notes" = "https://github.com/arnavk23/qcr/tree/main/releasenotes/notes"

[tool.setuptools.dynamic]
version = { attr = "qcr.__version__" }

[tool.setuptools.packages.find]
include = ["qcr*"]

[tool.setuptools.package-data]
qcr = ["py.typed"]

# ------------------------------------------------------------------ tooling
[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["external", "manuscripts", "cache", "results", "figures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY"]
ignore = [
    "E741",  # single-letter names (U, V, I) follow the physics notation
    "B905",  # zip(strict=) is not required on the supported Python range
]

[tool.ruff.lint.per-file-ignores]
# research scripts: sys.path set-up before imports, dense one-off plotting/report code
"experiments/*" = ["E402", "B007", "E501", "E702", "E731", "B023"]
"test/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["qcr"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-ra"
markers = ["slow: builds larger databases (deselect with '-m \"not slow\"')"]
filterwarnings = ["ignore::DeprecationWarning:qiskit.*"]

[tool.coverage.run]
source = ["qcr"]
branch = true
