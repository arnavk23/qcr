[tox]
minversion = 4.0
envlist = py310, py311, py312, py313, py314, lint
isolated_build = true

[testenv]
description = run the unit tests
extras = test
deps = qiskit-ibm-runtime
commands = pytest {posargs}

[testenv:lint]
description = lint and format check
skip_install = true
deps = ruff
commands =
    ruff check .
    ruff format --check .

[testenv:docs]
description = build the Sphinx documentation
extras = docs
commands = sphinx-build -W -b html docs docs/_build/html {posargs}

[testenv:coverage]
description = unit tests with coverage
extras = test
commands = pytest --cov=qcr --cov-report=term-missing {posargs}
